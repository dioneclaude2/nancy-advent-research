<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Hello Nancy · Advent calendar research</title>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,500;12..96,700&display=swap" rel="stylesheet">
<style>
:root{--pink:#FF30CC;--ink:#4B1528;--cream:#FFF7F0;--yellow:#FFF36B;--blue:#C9ECFF;--rose:#FFD6EC;--mint:#E3F7C9;--lilac:#E7DDFF}
*{box-sizing:border-box}
html,body{margin:0;background:var(--pink);color:var(--ink);font-family:'Bricolage Grotesque',system-ui,sans-serif}
a{color:inherit}
.top{position:sticky;top:0;z-index:5;background:var(--pink);display:flex;gap:10px;align-items:center;flex-wrap:wrap;padding:14px 20px}
.pill{border:2px solid var(--ink);border-radius:999px;padding:7px 16px;font-size:14px;background:var(--cream);cursor:pointer;font-family:inherit;color:var(--ink)}
.pill.on{background:var(--ink);color:var(--cream)}
.seg{display:inline-flex;border:2px solid var(--ink);border-radius:999px;overflow:hidden;background:var(--cream)}
.seg button{border:0;background:none;padding:7px 14px;font-size:14px;cursor:pointer;font-family:inherit;color:var(--ink)}
.seg button.on{background:var(--ink);color:var(--cream)}
.count{margin-left:auto;color:var(--cream);font-size:14px}
.stage{padding:0 20px 110px}
.page{display:none;max-width:860px;margin:0 auto;background:var(--cream);border-radius:22px;padding:30px 34px 36px;animation:in .35s ease}
.page.on{display:block}
@keyframes in{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
.meta{display:flex;justify-content:space-between;font-size:13px}
.hero{border-radius:18px;padding:22px;margin-top:16px;display:grid;grid-template-columns:1fr 260px;gap:18px;align-items:center}
.hero h1{font-size:64px;line-height:.92;margin:0;font-weight:500;letter-spacing:-2px}
.hero p{font-size:15px;line-height:1.5;margin:10px 0 0}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
.chip{border:2px solid var(--ink);border-radius:999px;padding:4px 12px;font-size:13px;background:var(--cream)}
.box{background:var(--cream);border-radius:14px;height:210px;display:grid;grid-template-columns:repeat(3,1fr);gap:6px;padding:12px}
.cal{background:#fff;border-radius:14px;padding:8px;display:flex;flex-direction:column;gap:6px}.cal img{width:100%;height:240px;object-fit:contain;border-radius:10px;display:block}.cal small{font-size:12px;text-align:center}
.chip.when{background:#fff}
.chip.ig{background:var(--ink);color:#fff;border-color:var(--ink)}
.box i{border-radius:6px;display:block}
.box span{grid-column:span 3;font-size:12px;text-align:center;align-self:center}
h2{font-size:28px;font-weight:500;margin:30px 0 8px;letter-spacing:-.5px}
.step{display:flex;gap:14px;margin-top:16px}
.svrow{display:flex;gap:8px;flex-wrap:wrap}.sv1{width:110px}.sv1 img{width:110px;height:196px;object-fit:cover;border-radius:12px;background:#fff;display:block}.sv1 .frame{width:110px}.sv1 small{display:block;font-size:11px;margin-top:4px}
.seev{font-size:12px;background:var(--rose);border-radius:999px;padding:2px 8px;white-space:nowrap}
.step.sv{display:grid;grid-template-columns:34px 1fr 200px;gap:16px;align-items:start;background:#fff;border-radius:16px;padding:14px}.step.sv .frame{width:200px}.vlab{margin-top:12px;padding:10px 12px;border-radius:12px;background:var(--cream)}.vlab b{display:block;font-weight:600}.vlab small{display:block;font-size:12px;opacity:.8;margin:2px 0 6px}
@media (max-width:760px){.step.sv{grid-template-columns:34px 1fr}.step.sv .frame{grid-column:2;width:100%;max-width:240px}}
.num{width:34px;height:34px;border-radius:50%;background:var(--yellow);border:2px solid var(--ink);display:flex;align-items:center;justify-content:center;font-size:15px;flex:none}
.step p{margin:4px 0 0;font-size:16px;line-height:1.45}
.step b{font-weight:500}
.media{display:flex;gap:12px;align-items:center;background:#fff;border-radius:14px;padding:10px;margin-top:10px;text-decoration:none;border:2px solid transparent;max-width:460px}
a.media:hover{border-color:var(--ink)}
.th{width:84px;height:58px;border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:22px;flex:none}
.memb{display:grid;grid-template-columns:220px 1fr;gap:16px;align-items:start;background:#fff;border-radius:14px;padding:10px;margin-top:10px;max-width:520px}.memb .frame{width:220px}.memb>div:last-child{padding-top:6px}.memb b{display:block;font-weight:600}.memb small{display:block;font-size:12px;opacity:.8;margin:4px 0 8px}
.mimgs{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:10px;max-width:480px}.mimgs img{width:100%;aspect-ratio:4/5;object-fit:cover;border-radius:12px;display:block}
.media small{display:block;font-size:12px;opacity:.8}
.panel{border-radius:18px;padding:18px 20px;margin-top:26px}
.plats{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
.plat{border:2px solid var(--ink);border-radius:999px;padding:6px 14px;font-size:14px;background:var(--cream);cursor:pointer;font-family:inherit;color:var(--ink)}
.plat.on{background:var(--ink);color:var(--cream)}
.how{background:var(--cream);border-radius:12px;padding:12px 14px;font-size:15px;margin-top:12px;line-height:1.45}
.rank{display:inline-block;font-size:11px;border-radius:999px;padding:2px 8px;background:var(--ink);color:var(--cream);margin-left:6px;vertical-align:2px}
.reels{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:12px;margin-top:14px}
.reel{display:flex;flex-direction:column;gap:8px}
.frame{position:relative;width:100%;aspect-ratio:9/16;border-radius:14px;overflow:hidden;background:var(--rose)}
.frame iframe{position:absolute;top:0;left:0;border:0;transform-origin:0 0;background:#000}
.frame .ph{text-decoration:none;color:var(--ink);position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;font-size:12px;text-align:center;padding:8px}
.score{display:flex;align-items:center;gap:8px}
.score b{background:var(--ink);color:var(--cream);border-radius:999px;padding:4px 10px;font-size:14px;font-weight:500}
.score span{font-size:12px}
.cap{font-size:12px;line-height:1.3}
.tag{font-size:11px;border-radius:999px;padding:2px 8px;border:1.5px dashed var(--ink);align-self:flex-start}
.note{font-size:13px;margin:4px 0 0;line-height:1.45}
.nancy{background:var(--yellow);border-radius:18px;padding:18px 20px;margin-top:26px}
.nancy p{font-size:16px;line-height:1.5;margin:6px 0 0}
.nav{position:fixed;left:0;right:0;bottom:18px;display:flex;justify-content:center;gap:10px;align-items:center;z-index:6}
.nav button{width:46px;height:46px;border-radius:50%;border:2px solid var(--ink);background:var(--cream);font-size:20px;cursor:pointer;color:var(--ink)}
.dots{display:flex;gap:6px;background:var(--cream);border:2px solid var(--ink);border-radius:999px;padding:8px 12px}
.dots i{width:9px;height:9px;border-radius:50%;border:1.5px solid var(--ink);cursor:pointer;display:block}
.dots i.on{background:var(--ink)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-top:16px}
.card{border-radius:16px;padding:16px}
.card h3{margin:0;font-size:20px;font-weight:500}
.card p{margin:6px 0 0;font-size:14px;line-height:1.45}
.list{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:10px;margin-top:14px}
.li{background:#fff;border-radius:14px;padding:12px;cursor:pointer;border:2px solid transparent}
.li:hover{border-color:var(--ink)}
.li b{font-weight:500;font-size:17px;display:block}
.li span{font-size:12px}
.section{display:inline-block;background:var(--lilac);border-radius:999px;padding:4px 12px;font-size:13px;margin-top:6px}
@media (max-width:760px){.hero{grid-template-columns:1fr}.hero h1{font-size:46px}.reels{grid-template-columns:repeat(2,minmax(0,1fr))}.grid2{grid-template-columns:1fr}.page{padding:22px 18px}}
</style>
</head>

<h2>4. How to use it for 12 Naughty Nights</h2>
<div class="step"><div class="num">1</div><div><p><b>Now → 15 Nov: sneak peek.</b> Show the big pink bow bag and one or two night bags, not the toys (Sephora UK’s sneak peek did 20x). Post the sign-up count as it grows.</p></div></div>

function render(){stage.innerHTML='';document.querySelector('.nav').style.display=view==='sum'?'none':'';if(view==='sum'){stage.innerHTML=`<div class="page on">${summary()}</div>`;setTimeout(()=>loadReels(stage.querySelector('.page')),50);dots.innerHTML='';document.getElementById('count').textContent='Summary';['pFind','y26','y25'].forEach(x=>document.getElementById(x).classList.remove('on'));document.getElementById('pSum').classList.add('on');try{history.replaceState(null,'','#summary')}catch(e){};return}document.getElementById('pSum').classList.remove('on');document.getElementById(year==='2025'?'y25':'y26').classList.add('on');CUR=year==='2025'?B25:B;S=[{id:'findings'}].concat(CUR.map(b=>({id:b.id,b})));if(i>=S.length)i=0;
S.forEach((s,k)=>{const d=document.createElement('div');d.className='page'+(k===i?' on':'');d.innerHTML=k===0?findings():brand(s.b,k);stage.appendChild(d)});
stage.querySelectorAll('.li').forEach(e=>e.onclick=()=>go(+e.dataset.go));
stage.querySelectorAll('.plat').forEach(p=>p.onclick=()=>{p.parentNode.querySelectorAll('.plat').forEach(q=>q.classList.remove('on'));p.classList.add('on');p.closest('.panel').querySelector('.how').textContent=p.dataset.h});
dots.innerHTML=S.map((_,k)=>`<i data-k="${k}"></i>`).join('');dots.querySelectorAll('i').forEach(e=>e.onclick=()=>go(+e.dataset.k));go(i,true)}
const dots=document.getElementById('dots');
function loadReels(page){page.querySelectorAll('.frame[data-code]').forEach(f=>{if(f.dataset.done)return;f.dataset.done=1;const w=f.clientWidth||200;const E=400,sc=(w*1.4222)/E;const ifr=document.createElement('iframe');ifr.src=`https://www.instagram.com/reel/${f.dataset.code}/embed/`;ifr.loading='lazy';ifr.setAttribute('scrolling','no');ifr.setAttribute('allow','autoplay; encrypted-media; picture-in-picture');ifr.title='Instagram Reel';ifr.style.width=E+'px';ifr.style.height='760px';ifr.style.transform=`scale(${sc})`;ifr.style.left=`${-0.1484*E*sc}px`;ifr.style.top=`${-54*sc}px`;f.appendChild(ifr)})}
function go(k,quiet){if(view==='sum')return;i=(k+S.length)%S.length;const pages=stage.querySelectorAll('.page');pages.forEach((p,j)=>p.classList.toggle('on',j===i));dots.querySelectorAll('i').forEach((d,j)=>d.classList.toggle('on',j===i));document.getElementById('count').textContent=i===0?'Findings':`${S[i].b.name} · ${i} of ${S.length-1}`;document.getElementById('pFind').classList.toggle('on',i===0);if(pages[i])loadReels(pages[i]);try{history.replaceState(null,'','#'+S[i].id)}catch(e){};if(!quiet)window.scrollTo({top:0,behavior:'smooth'})}
document.getElementById('prev').onclick=()=>go(i-1);document.getElementById('next').onclick=()=>go(i+1);
document.addEventListener('keydown',e=>{if(e.key==='ArrowRight')go(i+1);if(e.key==='ArrowLeft')go(i-1)});
document.getElementById('pFind').onclick=()=>{if(view!=='deck'){view='deck';i=0;render()}else go(0)};document.getElementById('pSum').onclick=()=>{view='sum';render();window.scrollTo({top:0})};
function setYear(y){if(year===y&&view==='deck')return;view='deck';year=y;i=0;document.getElementById('y26').classList.toggle('on',y==='2026');document.getElementById('y25').classList.toggle('on',y==='2025');render()}
document.getElementById('y26').onclick=()=>setYear('2026');document.getElementById('y25').onclick=()=>setYear('2025');
const h=location.hash.slice(1);if(h==='summary')view='sum';if(B25.some(b=>b.id===h)){year='2025';document.getElementById('y26').classList.remove('on');document.getElementById('y25').classList.add('on');S=[{id:'findings'}].concat(B25.map(b=>({id:b.id,b})));CUR=B25}const hk=S.findIndex(s=>s.id===h);if(hk>=0)i=hk;
render();
</script>
